# Prometheus 配置文件 — EchoMind 智能客服系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'saasbridge'
    environment: 'development'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # EchoMind 主应用指标
  - job_name: 'saasbridge-app'
    static_configs:
      - targets: ['saasbridge:8000']
        labels:
          service: 'saasbridge'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
